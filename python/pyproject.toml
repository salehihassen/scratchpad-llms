[project]
name = "scratchpad-llms-python"
version = "0.1.0"
description = "Scratchpad trying different integrations and scripts w/ LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.0",
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.9",
    "openai>=2.18.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.0",
]
